apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimantran-redis
  namespace: nimantran
  labels:
    app: nimantran-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nimantran-redis
  template:
    metadata:
      labels:
        app: nimantran-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nimantran-redis
  namespace: nimantran
  labels:
    app: nimantran-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: nimantran-redis
  type: ClusterIP
