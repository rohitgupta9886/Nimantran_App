apiVersion: v1
kind: Secret
metadata:
  name: nimantran-secrets
  namespace: nimantran
type: Opaque
stringData:
  POSTGRES_USER: "nimantran"
  POSTGRES_PASSWORD: "CHANGE_ME_PRODUCTION_DB_PASSWORD"
  DATABASE_URL: "postgresql+asyncpg://nimantran:CHANGE_ME_PRODUCTION_DB_PASSWORD@nimantran-postgres:5432/nimantran_db"
  REDIS_URL: "redis://nimantran-redis:6379/0"
  JWT_SECRET_KEY: "CHANGE_ME_PRODUCTION_JWT_SECRET_KEY"
