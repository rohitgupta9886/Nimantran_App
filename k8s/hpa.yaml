apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nimantran-backend-hpa
  namespace: nimantran
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nimantran-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nimantran-frontend-hpa
  namespace: nimantran
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nimantran-frontend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
