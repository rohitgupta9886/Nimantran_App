apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimantran-frontend
  namespace: nimantran
  labels:
    app: nimantran-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nimantran-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nimantran-frontend
    spec:
      containers:
        - name: frontend
          image: nimantran-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: nimantran-frontend
  namespace: nimantran
  labels:
    app: nimantran-frontend
spec:
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: nimantran-frontend
  type: ClusterIP
