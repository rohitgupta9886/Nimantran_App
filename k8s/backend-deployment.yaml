apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimantran-backend
  namespace: nimantran
  labels:
    app: nimantran-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nimantran-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nimantran-backend
    spec:
      containers:
        - name: backend
          image: nimantran-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: nimantran-config
            - secretRef:
                name: nimantran-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nimantran-backend
  namespace: nimantran
  labels:
    app: nimantran-backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: nimantran-backend
  type: ClusterIP
