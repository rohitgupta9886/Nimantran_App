version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nimantran_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nimantran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-nimantran_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nimantran} -d ${POSTGRES_DB:-nimantran_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nimantran_net

  redis:
    image: redis:7-alpine
    container_name: nimantran_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nimantran_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nimantran_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-nimantran}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-nimantran_dev}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_ENV=${APP_ENV:-development}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-nimantran_dev_secret_key_change_in_production}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nimantran_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nimantran_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - nimantran_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

networks:
  nimantran_net:
    driver: bridge
